[project]
name = "cad-harness"
version = "0.2.2"
description = "Safety-first deterministic 2D mechanical CAD automation over MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vu Xuan Quang" }]
maintainers = [{ name = "Vu Xuan Quang" }]
keywords = ["autocad", "cad", "mcp", "mechanical-engineering", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "structlog>=24.4.0,<26",
    "ezdxf>=1.3.5,<2",
    "numpy>=1.26,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14.0,<2",
    "mcp>=1.2.0,<2",
    "opencv-python-headless>=4.10,<5",
    "cryptography>=44,<51",
]

[project.urls]
Homepage = "https://github.com/xuanquangIT/autocad-mechanical-harness"
Documentation = "https://github.com/xuanquangIT/autocad-mechanical-harness/tree/main/docs"
Issues = "https://github.com/xuanquangIT/autocad-mechanical-harness/issues"
Repository = "https://github.com/xuanquangIT/autocad-mechanical-harness.git"

[project.optional-dependencies]
com = ["pywin32>=306; sys_platform == 'win32'"]
ui = ["PySide6>=6.8.0,<7"]

[project.scripts]
cad-harness = "apps.cli.__main__:main"
cad-harness-mcp = "apps.mcp_server.__main__:main"
cad-harness-desktop = "apps.engineer_desktop.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-cov>=6.0.0,<8",
    "hypothesis>=6.115.0,<7",
    "PySide6>=6.8.0,<7",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<2",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_harness", "apps"]

# `apps/` lives at the repository root (architecture section 23), so editable installs
# need both roots on sys.path, not just `src/`.
[tool.hatch.build]
dev-mode-dirs = ["src", "."]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running AutoCAD instance on Windows",
    "com: exercises the pywin32/ActiveX COM adapter",
    "bridge: exercises the C# named-pipe bridge",
    "golden: semantic golden drawing comparison",
    "slow: performance and large-fixture acceptance benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF", "ANN", "N"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]
"scripts/**" = ["ANN"]
# Alembic writes these; reformatting them obscures what autogenerate produced.
"src/cad_harness/persistence/migrations/versions/*" = ["E501", "ANN", "D"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"win32com".msg = "COM must only be imported inside cad_harness.adapters.autocad_com"
"pythoncom".msg = "COM must only be imported inside cad_harness.adapters.autocad_com"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["cad_harness"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["win32com.*", "pythoncom.*", "structlog.*"]
ignore_missing_imports = true

# ezdxf ships type hints but does not re-export its top-level helpers explicitly.
[[tool.mypy.overrides]]
module = ["ezdxf.*"]
ignore_missing_imports = true
implicit_reexport = true
