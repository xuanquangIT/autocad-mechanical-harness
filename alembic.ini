# Alembic configuration.
#
# Pilot and production machines migrate with Alembic so the schema history stays
# auditable. `cad-harness migrate` (create_all) is for development only.

[alembic]
script_location = src/cad_harness/persistence/migrations
prepend_sys_path = src
path_separator = os
# The URL is read from CAD_HARNESS_SQLITE_PATH in env.py; this is the fallback.
sqlalchemy.url = sqlite:///./data/harness.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
