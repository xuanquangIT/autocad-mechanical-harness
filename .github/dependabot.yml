version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      python-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Support beyond these declared caps requires a lockfile update and
      # dedicated compatibility evidence; range-only pip updates do neither.
      - dependency-name: pydantic
        versions:
          - ">=3"
      - dependency-name: pyyaml
        versions:
          - ">=7"
      - dependency-name: mcp
        versions:
          - ">=2"
      - dependency-name: opencv-python-headless
        versions:
          - ">=5"
      - dependency-name: structlog
        versions:
          - ">=26"
      - dependency-name: ezdxf
        versions:
          - ">=2"
      - dependency-name: numpy
        versions:
          - ">=3"
      - dependency-name: sqlalchemy
        versions:
          - ">=3"
      - dependency-name: alembic
        versions:
          - ">=2"
      - dependency-name: cryptography
        versions:
          - ">=51"
      - dependency-name: pyside6
        versions:
          - ">=7"
      - dependency-name: mypy
        versions:
          - ">=2"
      - dependency-name: pytest
        versions:
          - ">=9"
      - dependency-name: pytest-cov
        versions:
          - ">=8"
      - dependency-name: hypothesis
        versions:
          - ">=7"
      - dependency-name: ruff
        versions:
          - ">=1"
    open-pull-requests-limit: 2

  - package-ecosystem: nuget
    directory: "/dotnet/AutoCADBridge"
    schedule:
      interval: monthly
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
