name: Feature request
description: Propose a deterministic, testable improvement
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
      description: Describe the user problem and why the existing workflow is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe inputs, outputs, measurable rules, and expected failure behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What unit, property, golden, contract, or live acceptance evidence would prove it works?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
      description: Explain approval, revision, security, side effects, public contracts, dependencies, and AutoCAD version impact.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: This proposal does not ask the model or adapter to become the geometry kernel.
          required: true
        - label: I have not included customer drawings or proprietary standards.
          required: true
